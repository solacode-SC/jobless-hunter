# ===========================================
# JobHunter AI — Nginx Configuration
# ===========================================

# ─────────────────────────────────────────
# Upstream Definitions
# ─────────────────────────────────────────
upstream frontend_upstream {
    server 127.0.0.1:9876;
    keepalive 32;
}

upstream n8n_upstream {
    server 127.0.0.1:9877;
    keepalive 16;
}

upstream api_upstream {
    server 127.0.0.1:9878;
    keepalive 32;
}

# ─────────────────────────────────────────
# HTTP → HTTPS Redirect — Main App
# ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jobs.solaymanbuilds.com;

    # Allow ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────
# HTTP → HTTPS Redirect — n8n Automation
# ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name automation.solaymanbuilds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────
# HTTPS — Main Application
# jobs.solaymanbuilds.com
# ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobs.solaymanbuilds.com;

    # ── SSL Configuration ────────────────
    # Managed by Certbot — uncomment after running certbot:
    # ssl_certificate /etc/letsencrypt/live/jobs.solaymanbuilds.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jobs.solaymanbuilds.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/jobs.solaymanbuilds.com/chain.pem;

    # Self-signed fallback (remove after certbot setup):
    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # SSL hardening
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling (enable after certbot setup)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # ── Security Headers ─────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.openai.com wss:; frame-ancestors 'self';" always;

    # ── General Settings ─────────────────
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    # ── API Routes ───────────────────────
    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Larger timeouts for AI operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Don't buffer API responses
        proxy_buffering off;
    }

    # ── Next.js Frontend ─────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Static Assets Caching ────────────
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /favicon.ico {
        proxy_pass http://frontend_upstream;
        expires 30d;
        access_log off;
    }

    # ── Health Check Endpoint ────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Deny Hidden Files ────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/jobs.solaymanbuilds.com.access.log;
    error_log /var/log/nginx/jobs.solaymanbuilds.com.error.log warn;
}

# ─────────────────────────────────────────
# HTTPS — n8n Automation
# automation.solaymanbuilds.com
# ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name automation.solaymanbuilds.com;

    # ── SSL Configuration ────────────────
    # Managed by Certbot — uncomment after running certbot:
    # ssl_certificate /etc/letsencrypt/live/automation.solaymanbuilds.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/automation.solaymanbuilds.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/automation.solaymanbuilds.com/chain.pem;

    # Self-signed fallback (remove after certbot setup):
    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # SSL hardening (same as main)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Security Headers ─────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── General Settings ─────────────────
    client_max_body_size 25M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ── n8n Proxy with WebSocket ─────────
    location / {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Chunked transfer encoding for streaming
        chunked_transfer_encoding on;
        proxy_buffering off;
    }

    # ── Webhook paths (longer timeouts) ──
    location ~ ^/webhook/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ── Health Check ─────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Deny Hidden Files ────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/automation.solaymanbuilds.com.access.log;
    error_log /var/log/nginx/automation.solaymanbuilds.com.error.log warn;
}
